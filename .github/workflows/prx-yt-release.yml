name: PRX-YT Windows release

on:
  push:
    branches: [release/v1.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prx-yt-v1.0.0-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PRX_YT_INSTALL_DIR: ${{ runner.temp }}\prx-yt-installed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify PRX-YT identity and release version
        run: node -e "const p=require('./package.json');if(p.name!=='prx-yt'||p.productName!=='PRX-YT'||p.version!=='1.0.0'||p.build.appId!=='com.prxyt.desktop')throw Error('Wrong PRX-YT release identity')"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verify tests with the bundled Electron Node runtime
        run: node scripts/check-bundled-runtime.cjs
      - run: npm run package:windows
      - name: Verify packaged source and playback controller
        run: node scripts/check-package.cjs release-windows/win-unpacked/resources/app.asar
      - name: Exercise the unpacked application with local playback fixtures
        run: node scripts/smoke-youtube-playback.cjs release-windows/win-unpacked/PRX-YT.exe
      - name: Install into a clean directory
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'release-windows/PRX-YT-v1.0.0-Windows-x64-Setup.exe').Path
          if (Test-Path $env:PRX_YT_INSTALL_DIR) { throw 'The installer test directory is not empty' }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$env:PRX_YT_INSTALL_DIR" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (!(Test-Path "$env:PRX_YT_INSTALL_DIR/PRX-YT.exe")) { throw 'Installed PRX-YT.exe is missing' }
      - name: Verify installed source and playback behavior
        shell: pwsh
        run: |
          node scripts/check-package.cjs "$env:PRX_YT_INSTALL_DIR/resources/app.asar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-youtube-playback.cjs "$env:PRX_YT_INSTALL_DIR/PRX-YT.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksum the verified Windows installer
        shell: pwsh
        run: |
          $installerName = 'PRX-YT-v1.0.0-Windows-x64-Setup.exe'
          $digest = (Get-FileHash -Algorithm SHA256 "release-windows/$installerName").Hash.ToLowerInvariant()
          "$digest  $installerName" | Set-Content 'release-windows/SHA256SUMS-windows.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: prx-yt-v1.0.0-windows
          path: |
            release-windows/PRX-YT-v1.0.0-Windows-x64-Setup.exe
            release-windows/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prx-yt-v1.0.0-windows
          path: dist/windows
      - name: Verify release metadata and artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.0.0'
          cd dist/windows
          sha256sum -c SHA256SUMS-windows.txt
      - name: Publish the verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; published releases are not overwritten.'
            exit 0
          fi
          gh release create v1.0.0 \
            dist/windows/PRX-YT-v1.0.0-Windows-x64-Setup.exe \
            dist/windows/SHA256SUMS-windows.txt \
            --target "$GITHUB_SHA" \
            --title 'PRX-YT v1.0.0 — YouTube playback diagnostics' \
            --notes-file docs/PRX-YT-RELEASE-NOTES.md
